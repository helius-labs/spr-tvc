[package]
name = "spr-nitro-nsm"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-only"
publish = false

[dependencies]
minicbor = "=2.3.1"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = ">=0.30.1, <0.32", default-features = false, features = ["ioctl"] }

[dev-dependencies]
hex = "=0.4.3"
serde_json = "=1.0.150"
