# The production Nitro artifact has an independent dependency graph from QuorumOS.
[workspace]

[package]
name = "spr-nitro-decryption-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
publish = false

[dependencies]
clap = { version = "=4.5.53", features = ["derive"] }
spr-tvc-decryption-service = { path = "..", default-features = false, features = ["native-nitro"] }
tokio = { version = "=1.54.1", default-features = false, features = ["macros", "rt-multi-thread", "io-util"] }
