[package]
name = "spr-tvc-decryption-service"
version = "0.1.0"
description = "Attested decryption for Solana addresses without a registered private wallet"
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-only"
publish = false
autobins = false

[features]
default = ["qos-runtime"]
qos-runtime = ["dep:qos_core", "dep:qos_p256"]
native-nitro = ["dep:aws-nitro-enclaves-nsm-api", "dep:cms", "dep:openssl", "dep:pkcs1", "dep:serde", "dep:serde_cbor", "dep:tokio-vsock", "dep:getrandom", "dep:rand_core", "dep:vsss-rs", "dep:tower-http", "dep:hyper", "dep:hyper-util"]
# The unattested local testkit; the enclave binary never enables it.
local-dev = ["dep:serde", "dep:qos_p256"]

[dependencies]
axum = { version = "=0.8.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "=4.5.53", features = ["derive"] }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
hkdf = "=0.12.4"
hyper = { version = "1.11.1", default-features = false, features = ["http1", "server"], optional = true }
hyper-util = { version = "0.1.20", default-features = false, features = ["service", "tokio"], optional = true }
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa"] }
qos_core = { version = "=0.16.3", default-features = false, optional = true }
qos_p256 = { workspace = true, optional = true }
serde = { version = "=1.0.228", features = ["derive"], optional = true }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
solana-pubkey = "=4.2.0"
strum = { version = "=0.28.0", features = ["derive"] }
tokio = { version = "1.48.0", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
zeroize = "=1.9.0"
spr-keypair = "=0.10.0"
spr-tvc-protocol = { path = "../protocol" }

[target.'cfg(target_os = "linux")'.dependencies]
getrandom = { version = "=0.4.3", features = ["sys_rng"], optional = true }
rand_core = { version = "=0.10.1", optional = true }
vsss-rs = { version = "=6.0.1", default-features = false, features = ["alloc", "zeroize"], optional = true }
aws-nitro-enclaves-nsm-api = { version = ">=0.4.0, <0.6.0", optional = true }
cms = { version = "=0.2.3", features = ["std"], optional = true }
openssl = { version = "=0.10.82", features = ["vendored"], optional = true }
pkcs1 = { version = "=0.7.5", optional = true }
serde_cbor = { version = "=0.11.2", features = ["tags"], optional = true }
tokio-vsock = { version = "0.7.2", optional = true }
tower-http = { version = "=0.7.1", default-features = false, features = ["cors"], optional = true }

[dev-dependencies]
qos_p256.workspace = true
hex = "=0.4.3"
http-body-util = "=0.1.3"
tokio = { version = "1.48.0", default-features = false, features = ["io-util", "test-util"] }
tower = { version = "=0.5.3", features = ["util"] }

[[bin]]
name = "spr-tvc-decryption-service"
path = "src/main.rs"
required-features = ["qos-runtime"]

[[bin]]
name = "spr-tvc-decryption-service-local"
path = "src/bin/local.rs"
required-features = ["local-dev"]
