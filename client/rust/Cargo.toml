[package]
name = "spr-tvc-client"
version = "0.1.0"
description = "Attested client for the SPR decryption service"
edition.workspace = true
license.workspace = true
rust-version = "1.98"

[features]
# Unattested loopback connector for `just decryption-e2e`. Not a deployment configuration.
local-dev = []

[dev-dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
p256 = { version = "=0.14.0", default-features = false, features = ["arithmetic", "ecdsa", "std"] }
qos_p256.workspace = true
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
spr-keypair.workspace = true
spr-tvc-wire = { path = "../../wire" }

[dependencies]
base64 = { version = "=0.22.1" }
qos_core = { version = "=0.16.3", default-features = false }
bs58 = { version = "=0.5.1" }
getrandom = { version = "=0.2.17" }
hex = { version = "=0.4.3" }
hkdf = { version = "=0.12.4" }
p384 = { version = "=0.13.1", default-features = false, features = ["arithmetic", "ecdsa", "pkcs8", "std"] }
qos_p256.workspace = true
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking", "charset", "rustls-tls"] }
rustls-pki-types = { version = "=1.16.0", default-features = false, features = ["std"] }
rustls-webpki = { version = "=0.103.17", default-features = false, features = ["ring", "std"] }
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = { version = "=0.10.9" }
spr-keypair.workspace = true
spr-tvc-wire = { path = "../../wire" }
x509-cert = { version = "=0.2.5", default-features = false, features = ["pem", "std"] }
zeroize = { version = "=1.9.0", features = ["zeroize_derive"] }

[[test]]
name = "loopback"
path = "tests/loopback.rs"
required-features = ["local-dev"]

[[test]]
name = "gatekeeper"
path = "tests/gatekeeper.rs"
