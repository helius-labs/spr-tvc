[package]
name = "spr-tvc-devnet-tests"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dev-dependencies]
anyhow = "1"
base64 = "0.22"
getrandom = "0.4"
hex = "0.4"
qos_nsm = "=0.16.3"
qos_p256 = "=0.16.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-keypair = "3.1"
solana-signature = "3.4"
solana-signer = "3"
solana-system-interface = { version = "3.2", features = ["bincode"] }
spr-client = { git = "https://github.com/helius-labs/zolana.git", rev = "3c018b82fbc08322114990b88906872f4e72d65c", features = ["solana-rpc"] }
spr-interface = { git = "https://github.com/helius-labs/zolana.git", rev = "3c018b82fbc08322114990b88906872f4e72d65c" }
spr-keypair = { git = "https://github.com/helius-labs/zolana.git", rev = "3c018b82fbc08322114990b88906872f4e72d65c" }
spr-program = { git = "https://github.com/helius-labs/zolana.git", rev = "3c018b82fbc08322114990b88906872f4e72d65c" }
spr-transaction = { git = "https://github.com/helius-labs/zolana.git", rev = "3c018b82fbc08322114990b88906872f4e72d65c" }
spr-tvc-protocol = { path = "../../protocol" }

[profile.test]
debug = 0
incremental = false

[[test]]
name = "shielded_transfer"
path = "shielded_transfer.rs"
