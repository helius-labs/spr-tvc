# workflow_dispatch on protected main. Checks that gateway_commit is the
# private-wallet tip, checks out that commit, and builds
# apps/tvc-gateway/Dockerfile from that branch. Main's decryption gateway
# is gateway/ and is not the image this job publishes.
name: publish-tvc-gateway-image
run-name: Publish gateway ${{ inputs.gateway_commit }}

on:
  workflow_dispatch:
    inputs:
      gateway_commit:
        description: Full commit SHA at the tip of private-wallet
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-tvc-gateway-image
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: zolnet-tvc-gateway
  GATEWAY_COMMIT: ${{ inputs.gateway_commit }}

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: image-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Verify gateway source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/private-wallet" --jq .object.sha)
          if [[ "$GATEWAY_COMMIT" != "$branch_commit" ]]; then
            echo "::error::gateway_commit must match the current private-wallet tip"
            exit 1
          fi
          echo "tag=tvc-gateway-${GATEWAY_COMMIT::12}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.GATEWAY_COMMIT }}
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.ZOLNET_IMAGE_PUBLISHER_ROLE_ARN }}
          role-session-name: spr-tvc-publish-tvc-gateway
          aws-region: ${{ env.AWS_REGION }}

      - id: login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/tvc-gateway/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.source.outputs.tag }}
          cache-from: type=gha,scope=tvc-gateway
          cache-to: type=gha,mode=max,scope=tvc-gateway

      - name: Report pinned image
        env:
          IMAGE: ${{ steps.login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.source.outputs.tag }}@${{ steps.build.outputs.digest }}
        run: |
          printf 'Gateway source %s\n\n    %s\n' "$GATEWAY_COMMIT" "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
