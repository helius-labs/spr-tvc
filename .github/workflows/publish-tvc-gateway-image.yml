name: publish-tvc-gateway-image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-tvc-gateway-image
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: zolnet-tvc-gateway
  # Reviewed gateway source preserved on private-wallet for the devnet rehearsal.
  GATEWAY_COMMIT: a1e2847dd520ee135884f3f00af676fb5db29683

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: image-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.GATEWAY_COMMIT }}
          persist-credentials: false

      - id: source
        run: |
          test "$(git rev-parse HEAD)" = "$GATEWAY_COMMIT"
          echo "tag=tvc-gateway-${GATEWAY_COMMIT::12}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.ZOLNET_IMAGE_PUBLISHER_ROLE_ARN }}
          role-session-name: spr-tvc-publish-tvc-gateway
          aws-region: ${{ env.AWS_REGION }}

      - id: login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/tvc-gateway/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.source.outputs.tag }}
          cache-from: type=gha,scope=tvc-gateway
          cache-to: type=gha,mode=max,scope=tvc-gateway

      - name: Report pinned image
        env:
          IMAGE: ${{ steps.login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.source.outputs.tag }}@${{ steps.build.outputs.digest }}
        run: |
          printf 'Gateway source %s\n\n    %s\n' "$GATEWAY_COMMIT" "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
