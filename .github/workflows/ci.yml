name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libssl-dev linux-libc-dev musl-tools
      - run: just ci
      - name: Pack standalone TypeScript SDK
        run: |
          mkdir -p "$RUNNER_TEMP/decryption-sdk"
          npx --yes pnpm@9.15.0 --dir sdk pack --pack-destination "$RUNNER_TEMP/decryption-sdk"
          cd "$RUNNER_TEMP/decryption-sdk"
          sha256sum -- *.tgz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spr-decryption-sdk-${{ github.sha }}
          path: ${{ runner.temp }}/decryption-sdk/
          if-no-files-found: error
      - name: Check native KMS policy and provisioning
        run: python3 -B -m unittest discover -s tests/nitro
      - name: Build native Nitro service
        env:
          SPR_NETWORK: mainnet
        run: |
          rustup target add x86_64-unknown-linux-musl
          bash enclave/deploy/nitro/build-native.sh
          cargo tree --locked --manifest-path enclave/native/Cargo.toml --target x86_64-unknown-linux-musl -e normal > "$RUNNER_TEMP/native-graph"
          if grep -Eq 'qos_(core|p256)|tokio v1\.48|crypto-bigint v0\.[56]\.' "$RUNNER_TEMP/native-graph"; then
            exit 1
          fi
      - run: just build-local-binary
      - name: Package Linux loopback binary
        run: |
          mkdir -p dist
          tar -C target/release -czf dist/spr-tvc-local-linux-x86_64.tar.gz spr-tvc-decryption-service-local
          cd dist
          sha256sum spr-tvc-local-linux-x86_64.tar.gz > spr-tvc-local-linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spr-tvc-local-linux-x86_64
          path: dist/spr-tvc-local-linux-x86_64.tar.gz*
          if-no-files-found: error

  enclave-image:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - network: devnet
            check: enclave-image
          - network: mainnet
            check: mainnet-enclave-image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: enclave/Dockerfile
          platforms: linux/amd64
          push: false
          build-args: SPR_NETWORK=${{ matrix.network }}
          cache-from: type=gha,scope=decryption-service-${{ matrix.network }}
          cache-to: type=gha,mode=max,scope=decryption-service-${{ matrix.network }}
