name: Build native Nitro EIF

on:
  pull_request:
    paths:
      - .cargo/config.toml
      - .github/workflows/native-eif.yml
      - .github/workflows/publish-enclave-image.yml
      - Cargo.toml
      - enclave/Cargo.toml
      - enclave/deploy/nitro/approval.py
      - enclave/deploy/nitro/build-eif.sh
      - enclave/deploy/nitro/build-native.sh
      - enclave/deploy/nitro/eif.py
      - enclave/deploy/nitro/provenance.py
      - enclave/native/**
      - enclave/src/**
      - protocol/**
      - rust-toolchain.toml
  workflow_call:
    inputs:
      network:
        description: Network compiled into the enclave
        required: true
        type: string
      configuration:
        description: Reviewed configuration.json contents
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
       ((inputs.network == 'devnet' && startsWith(github.ref, 'refs/heads/')) ||
        (inputs.network == 'mainnet' && github.ref == 'refs/heads/main' && github.ref_protected &&
         github.workflow_ref == 'helius-labs/spr-tvc/.github/workflows/publish-enclave-image.yml@refs/heads/main')))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    env:
      SPR_NETWORK: ${{ inputs.network || 'devnet' }}
      NITRO_CLI_REVISION: 536dca352e130e23bb39b6227753c91ad702048d # aws-nitro-enclaves-cli v1.5.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aws/aws-nitro-enclaves-cli
          ref: ${{ env.NITRO_CLI_REVISION }}
          path: .nitro-source
          persist-credentials: false
      - name: Install build dependencies
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
          rustup toolchain install 1.94.1 --profile minimal
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libclang-dev libssl-dev linux-libc-dev musl-tools
          cargo +1.94.1 install --locked --path .nitro-source --root "$RUNNER_TEMP/nitro"
      - name: Build measured artifact
        env:
          CONFIGURATION_JSON: ${{ inputs.configuration }}
          RELEASE_BUILD: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          bash enclave/deploy/nitro/build-native.sh
          if [[ "$RELEASE_BUILD" == true ]]; then
            printf '%s' "$CONFIGURATION_JSON" > "$RUNNER_TEMP/configuration.json"
          else
            jq -nc '{releaseId:"ci", securityDomainId:("ab"*32), deployment:{mode:"serve", custody:{epoch:"1", noteSeedCommitment:("cd"*32), shareCommitments:[range(1;7) | ("0"+tostring)*32]}}}' > "$RUNNER_TEMP/configuration.json"
          fi
          export PATH="$RUNNER_TEMP/nitro/bin:$PATH"
          export NITRO_CLI_BLOBS="$GITHUB_WORKSPACE/.nitro-source/blobs/x86_64"
          export NITRO_CLI_LOGS_PATH="$RUNNER_TEMP/nitro-logs"
          mkdir -p "$NITRO_CLI_LOGS_PATH" dist
          enclave/deploy/nitro/build-eif.sh \
            enclave/native/target/x86_64-unknown-linux-musl/release/spr-nitro-decryption-service \
            "$RUNNER_TEMP/configuration.json" dist/native
          python3 -B enclave/deploy/nitro/provenance.py describe dist/native "$SPR_NETWORK" "$GITHUB_SHA" > dist/native/provenance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        with:
          name: unsigned-native-eif-${{ env.SPR_NETWORK }}-${{ github.sha }}
          path: dist/native/
          if-no-files-found: error
      - name: Show artifact for review
        if: github.event_name == 'workflow_dispatch'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            printf '### Native Nitro artifact for review\n\n[Unsigned EIF and configuration](%s)\n\n~~~json\n' "$ARTIFACT_URL"
            jq . dist/native/provenance.json
            printf '~~~\n\n### Build review pins\n\n~~~json\n'
            jq -n --arg commit "$GITHUB_SHA" --arg ref "$GITHUB_REF" \
              --arg digest "$(sha256sum dist/native/provenance.json | cut -d ' ' -f 1)" \
              '{sourceCommit:$commit, sourceRef:$ref, provenanceSha256:$digest}'
            printf '~~~\n'
          } >> "$GITHUB_STEP_SUMMARY"

  attest:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    environment: ${{ inputs.network == 'mainnet' && 'image-publish' || 'native-eif-devnet' }}
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.network == 'mainnet'
        with:
          persist-credentials: false
      - name: Verify independent mainnet review
        if: inputs.network == 'mainnet'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          timeout 20s gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" |
            python3 -B enclave/deploy/nitro/provenance.py check-review "$GITHUB_ACTOR_ID" "$GITHUB_RUN_ATTEMPT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: dist/native
      - name: Attest build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/native/provenance.json
      - name: Package provenance bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" dist/native/provenance.intoto.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-eif-${{ inputs.network }}-${{ github.sha }}
          path: dist/native/
          if-no-files-found: error
