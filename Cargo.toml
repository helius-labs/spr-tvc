[workspace]
members = [
    "apps/decryption-service",
    "apps/privacy-wallet",
    "crates/enclave",
    "crates/protocol",
]
exclude = [
    "apps/tvc-gateway",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
qos_p256 = { version = "=0.12.1", default-features = false }
