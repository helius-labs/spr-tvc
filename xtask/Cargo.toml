[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
autotests = false

[dependencies]
anyhow = "=1.0.104"
base64 = "=0.22.1"
clap = { version = "=4.5.53", features = ["derive"] }
hex = "=0.4.3"
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "std"] }
qos_core = { version = "=0.16.3", default-features = false }
qos_p256.workspace = true
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
spr-tvc-protocol = { path = "../protocol" }
tempfile = "=3.23.0"
toml_edit = { version = "=0.25.13", default-features = false, features = ["parse"] }
wait-timeout = "=0.2.1"
zeroize = "=1.9.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
